name: Build PTVRunner and Launcher
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner-release.yml'
      - 'bridge/**'
      - 'Launcher*.cs'
      - 'catalog.json'
      - 'assets/ptvrunner.jpg'
      - 'assets/new-gold.png'
      - 'assets/ptvegg.png'
permissions:
  contents: write
concurrency:
  group: ptvrunner-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: launcher-v1.8.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test and build bridge
        shell: pwsh
        run: |
          node --test bridge/pairing.test.mjs
          ./bridge/build.ps1
      - name: Build launcher and restore existing artwork
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/Poom99tv/PTVgame/releases/download/ptvboat-v1.0.0/PTVgame-Windows-v1.6.0.zip' -OutFile dist/base.zip
          if((Get-FileHash dist/base.zip -Algorithm SHA256).Hash.ToLower() -ne '92c7f1a7b7c2f074b5461804820adf7cc87bf34f9e3e112ed1dab575124667d4'){throw 'Base artwork package checksum mismatch'}
          Expand-Archive dist/base.zip dist/base
          Copy-Item dist/base/assets/* assets -Force
          ./build.ps1
          $p=Start-Process ./PTVgame-Launcher.exe -ArgumentList '--self-test' -WindowStyle Hidden -Wait -PassThru
          Get-Content test-results.txt
          if($p.ExitCode-ne 0){throw 'Launcher tests failed'}
          New-Item -ItemType Directory dist/launcher -Force|Out-Null
          Copy-Item PTVgame-Launcher.exe,catalog.json,README.md dist/launcher
          Copy-Item assets dist/launcher -Recurse
          Compress-Archive dist/launcher/* dist/PTVgame-Windows-v1.8.0.zip
          Compress-Archive dist/TikTokBridge-v7.exe dist/PTVRunner-Bridge-v7.0.2.zip
      - name: Upload release assets before changing manifests
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if($LASTEXITCODE-ne 0){gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'PTVegg + Launcher 1.8.0' --notes 'Adds PTVegg (Acorn Rush) to the Unity games with its cover rendered from the actual game. PTVRunner still opens Roblox and TikTokBridge together.' --latest=false}
          if($LASTEXITCODE-ne 0){throw 'Release creation failed'}
          gh release upload $env:RELEASE_TAG dist/PTVgame-Windows-v1.8.0.zip dist/PTVRunner-Bridge-v7.0.2.zip dist/TikTokBridge-v7.exe --repo $env:GITHUB_REPOSITORY --clobber
          if($LASTEXITCODE-ne 0){throw 'Asset upload failed'}
      - name: Publish verified manifests
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          $base="https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/"
          foreach($s in @(@{file='PTVgame-Windows-v1.8.0.zip';version='1.8.0';exe='PTVgame-Launcher.exe';manifest='launcher.json'},@{file='PTVRunner-Bridge-v7.0.2.zip';version='7.0.2';exe='TikTokBridge-v7.exe';manifest='ptvrunner-bridge.json'})){
            $p=Join-Path dist $s.file
            @{version=$s.version;url=$base+$s.file;sha256=(Get-FileHash $p -Algorithm SHA256).Hash.ToLower();size=(Get-Item $p).Length;executable=$s.exe}|ConvertTo-Json|Set-Content (Join-Path release-manifests $s.manifest) -Encoding utf8NoBOM
          }
          git add release-manifests/launcher.json release-manifests/ptvrunner-bridge.json
          git diff --cached --quiet
          if($LASTEXITCODE-ne 0){git commit -m 'Publish Launcher 1.8.0 (PTVegg) download manifests';git push origin HEAD:main;if($LASTEXITCODE-ne 0){throw 'Manifest push failed'}}
